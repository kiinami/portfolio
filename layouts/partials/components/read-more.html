{{- $ctx := .ctx | default nil -}}
{{- $href := .href | default (cond $ctx $ctx.RelPermalink "") -}}
{{- $align := .align | default "left" -}}

{{- if $href -}}
<div class="mt-3 flex {{ if eq $align "right" }}justify-end{{ else if eq $align "center" }}justify-center{{ end }}">
    <a href="{{ $href }}"
       class="ui-link hover:text-neso-splash focus-visible:text-neso-splash text-sm font-semibold relative z-20">
        {{ i18n "read_more" | default "Read more →" }}
    </a>
</div>
{{- end -}}
