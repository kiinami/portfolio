# Theme settings (general)
# --------------------------------

[params.neso]
ext_link_indicator = true
ext_link_no_opener_referrer = true
ext_link_new_window = true
hide_copyright = true
display_short_lang_name = true
home.display_mode = "profile"
home.profile.avatar_image = "/images/avatar.jpg"
home.profile.avatar_image_alt_text = "Avatar image"

[[params.neso.social.links]]
    name = "Github"
    url  = "https://github.com/kiinami"
[[params.neso.social.links]]
    name = "LinkedIn"
    url  = "https://www.linkedin.com/in/juan-pedro-galvez"
[[params.neso.social.links]]
    name = "Email"
    url  = "mailto:contact@jpgl.es"

[params.neso.home.list]
featured_entries_limit = 4

# Theme settings (EN)
# --------------------------------


# Theme settings (ES)
# --------------------------------

[languages.es.params.neso]
time_format = "2 de January de 2006"


# Build
# --------------------------------

# Project States
# --------------------------------
[params.project_states]
  "in progress" = { bg = "#22c55e", text = "#ffffff" }
  "finished"    = { bg = "#3b82f6", text = "#ffffff" }
  "dropped"     = { bg = "#ef4444", text = "#ffffff" }
  "paused"      = { bg = "#6b7280", text = "#ffffff" }

[minify]
  minifyOutput = true

[build]
  [build.buildStats]
    enable = true
  [[build.cachebusters]]
    source = 'assets/notwatching/hugo_stats\.json'
    target = 'css'
  [[build.cachebusters]]
    source = '(postcss|tailwind)\.config\.js'
    target = 'css'
  
[module]
  [[module.mounts]]
    source = 'assets'
    target = 'assets'
  [[module.mounts]]
    disableWatch = true
    source = 'hugo_stats.json'
    target = 'assets/notwatching/hugo_stats.json'

[outputs]
  home = ["html", "json"]

[caches]
  [caches.images]
    dir = ':cacheDir/images'

# Markdown
# --------------------------------

[markup]
  [markup.goldmark]
    [markup.goldmark.parser]
      wrapStandAloneImageWithinParagraph = false

      [markup.goldmark.parser.attribute]
        block = true

    [markup.goldmark.renderer]
      unsafe = true

  [markup.highlight]
    noClasses = false

  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
