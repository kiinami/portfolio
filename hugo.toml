# General
# --------------------------------

baseURL = "https://jpgl.es/"
title = "Juan Pedro Gálvez López"
theme = ["neso", "hugo-photoswipe5-gallery"]

timeZone = "Europe/Madrid"
languageCode = "en-us"
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false

# i18n & Language-Specific Theme Settings
# --------------------------------

[languages.en]
disabled          = false
languageCode      = "en-us"
languageDirection = "ltr"
languageName      = "English"
hasCJKLanguage    = false
title             = "Juan Pedro Gálvez López"
weight            = 1

[languages.es]
disabled          = false
languageCode      = "es"
languageDirection = "ltr"
languageName      = "Español"
hasCJKLanguage    = false
title             = "Juan Pedro Gálvez López"
weight            = 2

